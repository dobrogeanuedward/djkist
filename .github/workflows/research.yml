name: Verify public KIST media
on:
  push:
    paths: ['.github/workflows/research.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public session metadata
        run: |
          python - <<'PY'
          import urllib.request,html,json,re,base64
          from html.parser import HTMLParser
          class Tags(HTMLParser):
            def __init__(self): super().__init__(); self.meta={}
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='meta': self.meta[a.get('property',a.get('name',''))]=a.get('content','')
          def read(url):
            return urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=25).read()
          for url in ['https://www.instagram.com/reel/DbbEcZJt6uv/','https://www.instagram.com/p/DMadZ8fMePw/']:
            try:
              text=read(url).decode(); p=Tags();p.feed(text)
              print('META '+json.dumps({'source':url,'meta':p.meta},ensure_ascii=False))
              img=p.meta.get('og:image','')
              if img and 'cdninstagram.com/rsrc' not in img:
                data=read(img);print('PHOTO '+json.dumps({'source':url,'mime':'image/jpeg','base64':base64.b64encode(data).decode()}))
            except Exception as e: print('ERROR '+str(e)[:200])
          for url in ['https://soundcloud.com/link-academy-radio','https://www.linkacademyradio.com/','https://www.youtube.com/@linkacademyradio/videos']:
            try:
              text=read(url).decode()
              for match in re.finditer('kist',text,re.I): print('MATCH '+url+' '+text[max(0,match.start()-300):match.end()+800].replace('\n',' ')[:1200])
            except Exception as e:print('ERROR '+str(e)[:200])
          PY
